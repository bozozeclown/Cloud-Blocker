# Cloud Blocker (Linux) configuration
# Sourced by cloudblocker-common.sh. Bash syntax.

# Where state/logs live
CLOUDBLOCKER_DIR="/etc/cloudblocker"

# nftables table name
NFT_TABLE="cloudblocker"

# Size guard: refuse to block more than this many CIDRs without --force
MAX_CIDRS_WITHOUT_FORCE=5000

# Guard: how long a "pending" (uncommitted) apply may exist before it is reverted
COMMIT_GRACE_SECONDS=300

# How often the guard timer runs (kept in sync with the systemd unit)
GUARD_INTERVAL_MINUTES=10

# Default trial window (auto-unblock) for `--trial` with no value
TRIAL_MINUTES_DEFAULT=15

# Connectivity canaries: must NOT be inside any AWS/GCP/Azure published range.
CANARIES=("1.1.1.1:443" "9.9.9.9:443" "8.8.8.8:53")

# Extra CIDRs/prefixes to always exclude (space separated), e.g. ("8.8.8.0/24")
EXTRA_EXCLUDE=()

# Provider sources (empty = resolve automatically / unsupported)
PROVIDER_AWS_URL="https://ip-ranges.amazonaws.com/ip-ranges.json"
PROVIDER_GCP_URL="https://www.gstatic.com/ipranges/cloud.json"
PROVIDER_AZURE_URL=""
